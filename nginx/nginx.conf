events {}

http {

    # Security
    server_tokens off;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    upstream frontend {
        server frontend:80;
    }

    upstream backend {
        server backend:8000;
    }

    upstream uptime_kuma {
        server uptime-kuma:3001;
    }

    upstream grafana {
        server grafana:3000;
    }

    # -------------------------
    # HTTP -> HTTPS Redirect
    # (catches all domains)
    # -------------------------
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # -------------------------
    # RewardsHub HTTPS
    # -------------------------
    server {
        listen 443 ssl;
        server_name rewardshub.sreeramonline.com sreeramonline.com rewardshub.sreeram.site;

        ssl_certificate
            /etc/letsencrypt/live/rewardshub.sreeramonline.com/fullchain.pem;
        ssl_certificate_key
            /etc/letsencrypt/live/rewardshub.sreeramonline.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /docs {
            proxy_pass http://backend/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /openapi.json {
            proxy_pass http://backend/openapi.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # -------------------------
    # Uptime Kuma HTTPS
    # -------------------------
    server {
        listen 443 ssl;
        server_name status.sreeramonline.com status.sreeram.site;

        ssl_certificate
            /etc/letsencrypt/live/status.sreeramonline.com/fullchain.pem;
        ssl_certificate_key
            /etc/letsencrypt/live/status.sreeramonline.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://uptime_kuma;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # -------------------------
    # Grafana HTTPS
    # -------------------------
    server {
        listen 443 ssl;
        server_name grafana.sreeramonline.com grafana.sreeram.site;

        ssl_certificate
            /etc/letsencrypt/live/grafana.sreeramonline.com/fullchain.pem;
        ssl_certificate_key
            /etc/letsencrypt/live/grafana.sreeramonline.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://grafana;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

}
